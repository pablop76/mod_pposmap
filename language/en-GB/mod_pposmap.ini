MOD_PPOSMAP_NAME="Map with points"
MOD_PPOSMAP_DESCRIPTION="Displays a map with markers and an optional list of locations. Choose between Mapbox and Leaflet with OpenStreetMap."
MOD_PPOSMAP_DESRIPTION_GROUPS="Show the option to sort points by the set group name"
MOD_PPOSMAP_TOKEN_MAPBOX="Add <a target='_blank' rel='noreferrer' href='https://www.mapbox.com/studio/account/tokens'>Token Mapbox</a>"
MOD_PPOSMAP_STYLE_MAPBOX="Add a custom <a target='_blank' rel='noreferrer' href='https://docs.mapbox.com/studio-manual/guides/map-styling/#template-styles'>Mapbox style</a>"
MOD_PPOSMAP_LONGITUDE="Longitude"
MOD_PPOSMAP_LATITUDE="Latitude"
MOD_PPOSMAP_OPENINGHOURS="Opening hours"
MOD_PPOSMAP_TELEPHONE="Phone number"
MOD_PPOSMAP_ZOOM="Default zoom"
MOD_PPOSMAP_GEOTITLE="Marker title"
MOD_PPOSMAP_GEODESCRIPTION="Marker description"
MOD_PPOSMAP_GEODESCRIPTION_DESC="Simple HTML formatting works in the map popup, e.g. &lt;strong&gt;bold&lt;/strong&gt;, &lt;em&gt;italics&lt;/em&gt;, &lt;a href&gt;a link&lt;/a&gt; or a list. The points list next to the map shows plain text without markup, because it is truncated there."
MOD_PPOSMAP_OPENINGHOURS_DESC="The label shown to visitors. Each line appears on a separate row. Fill in the search engine version below, in the Schema.org format field."
MOD_PPOSMAP_MARKER="Default marker icon"
MOD_PPOSMAP_MARKER_DESC="Optional. Used for every point that has no marker of its own. If empty, the default marker of the selected map provider is shown."
MOD_PPOSMAP_MARKER_WIDTH="Marker width (px)"
MOD_PPOSMAP_MARKER_WIDTH_DESC="Optional. Defaults to 50 px. The image is fitted inside a box of the given size while keeping its aspect ratio, so it is never distorted."
MOD_PPOSMAP_MARKER_HEIGHT="Marker height (px)"
MOD_PPOSMAP_MARKER_HEIGHT_DESC="Optional. Defaults to 64 px."
MOD_PPOSMAP_MARKER_ANCHOR="Marker anchor point"
MOD_PPOSMAP_MARKER_ANCHOR_DESC="The part of the image that points at the exact coordinates. Choose 'Bottom' for a classic pin with a tip, 'Centre' for a round marker."
MOD_PPOSMAP_MARKER_ANCHOR_BOTTOM="Bottom (pin tip)"
MOD_PPOSMAP_MARKER_ANCHOR_CENTER="Centre"
MOD_PPOSMAP_MARKER_ANCHOR_TOP="Top"
MOD_PPOSMAP_POPUP_IMAGE="Popup image"
MOD_PPOSMAP_POPUP_IMAGE_DESC="Optional. Image shown in the popup after clicking the marker."
MOD_PPOSMAP_POINT_MARKER="Marker icon for this point"
MOD_PPOSMAP_POINT_MARKER_DESC="Optional. Overrides the default marker from the map settings for this single point. Useful to tell e.g. a head office apart from pickup points."
MOD_PPOSMAP_SUBFORM_FIELD="Add another <a target='_blank' rel='noreferrer' href='https://www.latlong.net/'>point on the map</a>"
MOD_PPOSMAP_SUBFORM_FIELD_DESC="Each row is one marker on the map. Only the coordinates are required, all other fields are optional."
MOD_PPOSMAP_CLEAR_POINTS="Removing all points"
MOD_PPOSMAP_CLEAR_POINTS_DESC="Clears the whole list of points at once instead of deleting rows one by one. Nothing is stored until you press Save, so leaving the module without saving brings the points back. An Undo button is also available right after clearing."
MOD_PPOSMAP_CLEAR_POINTS_BUTTON="Remove all points"
MOD_PPOSMAP_CLEAR_POINTS_CONFIRM="Remove all points from the form? There are %d of them.\n\nThey disappear from the form at once, but stay in the database until you press Save. You can undo this with the Undo button or by leaving the module without saving."
MOD_PPOSMAP_CLEAR_POINTS_EMPTY="There is no point to remove."
MOD_PPOSMAP_CLEAR_POINTS_DONE="Points removed from the form: %d. The change is stored only after you press Save."
MOD_PPOSMAP_CLEAR_POINTS_UNDO="Undo"
MOD_PPOSMAP_CLEAR_POINTS_RESTORED="Points restored: %d."
MOD_PPOSMAP_CLEAR_POINTS_MISSING="The points list was not found in the form, so the button is disabled."
MOD_PPOSMAP_SHOW_LIST_POINTS="Show points list"
MOD_PPOSMAP_SHOW_LIST_POINTS_DESC="The points list is shown on desktop only (it is hidden on mobile)."
MOD_PPOSMAP_TILE_URL="Tile server URL"
MOD_PPOSMAP_TILE_URL_DESC="Optional. URL template with {z}/{x}/{y} placeholders, e.g. https://tile.openstreetmap.org/{z}/{x}/{y}.png. Append an API key as a query parameter, e.g. ?apikey=YOUR_KEY. If empty, OpenStreetMap tiles are used. When you change the provider, fill in the 'Tile attribution' field as well, because the default OpenStreetMap attribution no longer applies. Style preview and ready-made URLs: <a target='_blank' rel='noreferrer' href='https://leaflet-extras.github.io/leaflet-providers/preview/'>leaflet-providers</a>."
MOD_PPOSMAP_TILE_ATTRIBUTION="Tile attribution"
MOD_PPOSMAP_TILE_ATTRIBUTION_DESC="Optional. Copyright notice shown in the map corner, HTML links allowed. Required by most tile providers. If empty, the OpenStreetMap attribution is shown."
MOD_PPOSMAP_TILE_MIN_ZOOM="Tile min zoom"
MOD_PPOSMAP_TILE_MIN_ZOOM_DESC="Optional. Lowest zoom level supported by the tile provider. If empty, the Leaflet default applies."
MOD_PPOSMAP_TILE_MAX_ZOOM="Tile max zoom"
MOD_PPOSMAP_TILE_MAX_ZOOM_DESC="Optional. Highest zoom level supported by the provider. Beyond it the map shows grey squares instead of tiles. OpenStreetMap supports 19."
MOD_PPOSMAP_CHOICEMAPBOXLEAFLET="Provider"
MOD_PPOSMAP_MAPBOXCHOICE="Mapbox"
MOD_PPOSMAP_LEAFLETCHOICE="Leaflet"
MOD_PPOSMAP_FIELDSET_DISPLAY="Map settings"
MOD_PPOSMAP_LAYER_GROUPS="Layer Groups"
MOD_PPOSMAP_LAYER_GROUP_NAME="Group name"
MOD_PPOSMAP_GROUP_LEAFLET_ALL="All"
MOD_PPOSMAP_MAP_HEIGHT="Map height"
MOD_PPOSMAP_MAP_HEIGHT_DESC="Optional. Examples: 500px, 70vh, 100%. If empty, the default height from CSS is used."
MOD_PPOSMAP_MAP_HEIGHT_MOBILE="Map height (mobile)"
MOD_PPOSMAP_MAP_HEIGHT_MOBILE_DESC="Optional. Examples: 400px or 60vh. If empty, the 'Map height' value is used (or a safe minimum)."
MOD_PPOSMAP_ADD_SCHEMA="Add structured data (Schema.org)"
MOD_PPOSMAP_ADD_SCHEMA_DESC="Adds an invisible JSON-LD (Schema.org) marker with the list of points for search engines. Disable if you already have your own structured data for these locations."
MOD_PPOSMAP_STREET_ADDRESS="Street address"
MOD_PPOSMAP_STREET_ADDRESS_DESC="For structured data. Street and number only, without postcode and town."
MOD_PPOSMAP_POSTAL_CODE="Postcode"
MOD_PPOSMAP_ADDRESS_LOCALITY="Town or city"
MOD_PPOSMAP_SCHEMA_OPENING_HOURS="Opening hours in Schema.org format"
MOD_PPOSMAP_SCHEMA_OPENING_HOURS_DESC="For structured data, machine format, one rule per line. Two-letter days: Mo, Tu, We, Th, Fr, Sa, Su. Example: Mo-Fr 09:00-17:00 on the first line and Sa 10:00-14:00 on the second. The module expands this into a full opening hours specification, so it works for every object type. The label shown to visitors goes in the 'Opening hours' field above. A line in any other format is skipped."
MOD_PPOSMAP_POINT_URL="Location page URL"
MOD_PPOSMAP_POINT_URL_DESC="For structured data. Link to a page describing this location, if one exists."
MOD_PPOSMAP_SCHEMA_TYPE="Structured data type for points"
MOD_PPOSMAP_SCHEMA_TYPE_DESC="What the points on the map are. 'Place' and 'Tourist attraction' describe a location; the other types also state a business activity and only they can be tied to an organisation. Do not mark up as a business any point you do not own."
MOD_PPOSMAP_SCHEMA_TYPE_PLACE="Place"
MOD_PPOSMAP_SCHEMA_TYPE_TOURISTATTRACTION="Tourist attraction"
MOD_PPOSMAP_SCHEMA_TYPE_LOCALBUSINESS="Local business"
MOD_PPOSMAP_SCHEMA_TYPE_STORE="Store"
MOD_PPOSMAP_SCHEMA_TYPE_RESTAURANT="Restaurant"
MOD_PPOSMAP_SCHEMA_TYPE_MEDICALBUSINESS="Medical business"
MOD_PPOSMAP_SCHEMA_TYPE_AUTOMOTIVEBUSINESS="Automotive business"
MOD_PPOSMAP_SCHEMA_TYPE_PROFESSIONALSERVICE="Professional service"
MOD_PPOSMAP_SCHEMA_TYPE_LODGINGBUSINESS="Lodging business"
MOD_PPOSMAP_SCHEMA_MENU_ITEMS="Emit structured data only on these pages"
MOD_PPOSMAP_SCHEMA_MENU_ITEMS_DESC="Optional. If empty, the markup appears everywhere the module is displayed. If the module is assigned to all pages, pick a single page here: repeating the same locations on every page of the site is undesirable, because business data belongs on the page that actually describes it."
MOD_PPOSMAP_SCHEMA_OWN_LOCATIONS="These are my own locations"
MOD_PPOSMAP_SCHEMA_OWN_LOCATIONS_DESC="Enable only when the points are branches, pickup points or premises of the entity running this site. The module then adds an Organization node and links every point to it. For a map of independent businesses, such as a directory, leave this off: tying someone else's business to your organisation would misrepresent it to search engines."
MOD_PPOSMAP_SAME_AS="External profiles of this point"
MOD_PPOSMAP_SAME_AS_DESC="For structured data. URLs describing the same location elsewhere, e.g. a Google Business Profile or a Facebook page. One URL per line."
MOD_PPOSMAP_ADDRESS_COUNTRY="Country"
MOD_PPOSMAP_ADDRESS_COUNTRY_DESC="For structured data, shared by all points. Two-letter ISO code, e.g. GB. If empty, no country is emitted."
MOD_PPOSMAP_VIEW_BUTTON="VIEW"
MOD_PPOSMAP_LIST_WIDTH="Points list width"
MOD_PPOSMAP_LIST_WIDTH_DESC="Optional. Examples: 300px, 25rem or 25%. Defaults to 300px. A column that is too narrow breaks the address and the button across several lines."
MOD_PPOSMAP_VIEW_BUTTON_TEXT="Button label"
MOD_PPOSMAP_VIEW_BUTTON_TEXT_DESC="Optional. If empty, the label from the translation is used ('VIEW' by default)."
MOD_PPOSMAP_VIEW_BUTTON_CLASS="Button CSS classes"
MOD_PPOSMAP_VIEW_BUTTON_CLASS_DESC="Optional. If empty, the button gets the module's own neutral styling. Entering classes replaces it entirely so styles do not clash: for a Bootstrap template use e.g. btn btn-primary."
MOD_PPOSMAP_CLUSTER_MARKERS="Cluster nearby markers"
MOD_PPOSMAP_CLUSTER_MARKERS_DESC="When many points are close together, groups them into a single marker with a count — clicking zooms in. Recommended for more than a dozen or so points."
MOD_PPOSMAP_FIELDSET_GEOJSON="GeoJSON"
MOD_PPOSMAP_GEOJSON_SOURCE="GeoJSON data source"
MOD_PPOSMAP_GEOJSON_SOURCE_DESC="GeoJSON is an open format that describes shapes on a map: points, lines and areas. It lets you load many locations at once instead of adding them one by one, and it can draw things a pin cannot show: a service area, a route, a municipal boundary. Files in this format are exported by Google My Maps, geojson.io and QGIS, among others."
MOD_PPOSMAP_GEOJSON_SOURCE_NONE="Disabled"
MOD_PPOSMAP_GEOJSON_SOURCE_PASTE="Pasted content"
MOD_PPOSMAP_GEOJSON_SOURCE_FILE="File on the server"
MOD_PPOSMAP_GEOJSON_DATA="GeoJSON content"
MOD_PPOSMAP_GEOJSON_DATA_DESC="Paste the whole file. The module accepts a FeatureCollection, a single Feature and a bare geometry. For large files choose „File on the server” above: content pasted here grows the module settings stored in the database and the source of every page where the module is displayed."
MOD_PPOSMAP_GEOJSON_FILE="Path to the file"
MOD_PPOSMAP_GEOJSON_FILE_DESC="Path relative to the Joomla root, for example images/data/areas.geojson. Upload the file with the media manager or over FTP. Allowed extensions are .geojson and .json, and only from inside the site directory. External addresses are not supported, because they would mean a request to a foreign server on every page view."
MOD_PPOSMAP_GEOJSON_FIT="Fit the view to the data"
MOD_PPOSMAP_GEOJSON_FIT_DESC="After loading, the map sets its centre and zoom so that all points and areas fit on screen. The „Zoom” setting is then ignored. Turn this off if you would rather choose the framing yourself."
MOD_PPOSMAP_GEOJSON_STYLE_LABEL="Appearance of lines and areas"
MOD_PPOSMAP_GEOJSON_STYLE_DESC="These settings apply to line and area geometries. Points from the file get the module's normal pin, the one from the „Map settings” tab. If an individual object in the file carries its own simplestyle properties (stroke, stroke-width, stroke-opacity, fill, fill-opacity), those take precedence over the settings below."
MOD_PPOSMAP_GEOJSON_STROKE="Line and outline colour"
MOD_PPOSMAP_GEOJSON_STROKE_DESC="Colour of routes and of area edges."
MOD_PPOSMAP_GEOJSON_STROKE_WIDTH="Line width (px)"
MOD_PPOSMAP_GEOJSON_STROKE_OPACITY="Line opacity (0 to 1)"
MOD_PPOSMAP_GEOJSON_FILL="Area fill colour"
MOD_PPOSMAP_GEOJSON_FILL_DESC="Applies to polygons only. Lines have no fill."
MOD_PPOSMAP_GEOJSON_FILL_OPACITY="Fill opacity (0 to 1)"
MOD_PPOSMAP_GEOJSON_FILL_OPACITY_DESC="A value of 0 leaves the outline only, 1 makes the area fully opaque."
MOD_PPOSMAP_GEOJSON_MAPPING_LABEL="Where to read point content from"
MOD_PPOSMAP_GEOJSON_MAPPING_DESC="Every object in the file carries a set of properties, but their names differ between programs. Google My Maps stores the name as „name”, while an OpenStreetMap export stores the address as „addr:street”. Enter the property names the module should look for. An empty field means that piece of information is not read."
MOD_PPOSMAP_GEOJSON_PROP_TITLE="Property holding the title"
MOD_PPOSMAP_GEOJSON_PROP_DESCRIPTION="Property holding the description"
MOD_PPOSMAP_GEOJSON_PROP_TELEPHONE="Property holding the phone number"
MOD_PPOSMAP_GEOJSON_PROP_OPENINGHOURS="Property holding the opening hours"
MOD_PPOSMAP_GEOJSON_PROP_OPENINGHOURS_DESC="The value goes into the popup as plain text. It is not passed to structured data, which requires a machine readable format that files rarely preserve."
MOD_PPOSMAP_GEOJSON_PROP_IMAGE="Property holding the image"
MOD_PPOSMAP_GEOJSON_PROP_IMAGE_DESC="May contain a path relative to the site directory or a full address on a foreign server. Images from other servers load more slowly and disappear once that site removes them."
MOD_PPOSMAP_GEOJSON_PROP_GROUP="Property holding the group name"
MOD_PPOSMAP_GEOJSON_PROP_GROUP_DESC="Optional, for Leaflet mode with layer groups enabled. Lets you split points from the file into switchable layers, for example by type of object."
MOD_PPOSMAP_GEOJSON_SCHEMA="Add points from the file to structured data"
MOD_PPOSMAP_GEOJSON_SCHEMA_DESC="Points from the file then join the Schema.org block alongside the ones added by hand. An object without a name is always skipped, because a node carrying nothing but coordinates tells a search engine nothing. Lines and areas never reach structured data. Turn this off if the file holds other people's objects or data whose accuracy is not yours to vouch for."
MOD_PPOSMAP_GEOJSON_PROP_STREET="Property holding the street and number"
MOD_PPOSMAP_GEOJSON_PROP_POSTALCODE="Property holding the postal code"
MOD_PPOSMAP_GEOJSON_PROP_LOCALITY="Property holding the locality"
MOD_PPOSMAP_GEOJSON_PROP_URL="Property holding the page address"
MOD_PPOSMAP_ABOUT_GEOJSON_LABEL="Loading data from a GeoJSON file"
MOD_PPOSMAP_ABOUT_GEOJSON_DESC="<p>In the <strong>GeoJSON</strong> tab the module can load a ready made map data file. That gives you two things at once.</p><ul><li><strong>Many locations in one go.</strong> Instead of adding a hundred points by hand, you point at a single file. Points from it behave exactly like those added in the Module tab: they get a pin and a popup, they appear in the list beside the map, and they can reach structured data.</li><li><strong>Shapes a pin cannot show.</strong> Lines and areas describe something that runs along a path or something that covers ground: a service area, a trail, a municipal boundary, a delivery zone.</li></ul><p><strong>Where to get a file.</strong> The simplest route is to draw one at <a target='_blank' rel='noreferrer' href='https://geojson.io/'>geojson.io</a>, which runs in the browser and needs no account. You can also export your own map from Google My Maps, or receive a file from someone working in QGIS. Administrative boundaries are often published in exactly this format.</p><ul><li><strong>The coordinate order is a common trap.</strong> This format stores longitude first and latitude second, the opposite of Google Maps. A point whose coordinates fall outside the valid range is skipped rather than placed somewhere random.</li><li><strong>The look of an individual object may live in the file itself.</strong> If an object carries simplestyle properties the module honours them, and the colour settings in the panel then apply only to objects without a style of their own.</li><li><strong>A large file is better uploaded than pasted.</strong> Pasted content is stored in the module settings and grows the source of every page where the map appears.</li><li><strong>If the file fails to load the map still works</strong>, and the reason is written to the browser console (F12, Console tab).</li></ul>"
MOD_PPOSMAP_FIELDSET_ABOUT="About"
MOD_PPOSMAP_ABOUT_INTRO_LABEL="Map with points"
MOD_PPOSMAP_ABOUT_INTRO_DESC="<p>The module shows a map with marked locations and an optional list of points beside it. Clicking a marker opens a popup with the title, description, image, opening hours and phone number.</p><p>Two map providers are available. <strong>Leaflet</strong> draws the map on OpenStreetMap tiles and works straight away, with no account needed. <strong>Mapbox</strong> offers richer styles and smoother animation, but requires a free token and has a view limit on the free plan.</p>"
MOD_PPOSMAP_ABOUT_START_LABEL="Getting started"
MOD_PPOSMAP_ABOUT_START_DESC="<ol><li>On the <strong>Module</strong> tab pick a map provider. For Mapbox paste your token; for Leaflet nothing else is needed.</li><li>Add locations with the <strong>Add another point on the map</strong> button. Only the coordinates are required, fill in the rest as needed.</li><li>You can read coordinates off Google Maps: right-click the spot and the first entry in the menu is the latitude and longitude. They are also available from <a target='_blank' rel='noreferrer' href='https://www.latlong.net/'>latlong.net</a>.</li><li>On the <strong>Map settings</strong> tab set the zoom, the map height and the marker appearance.</li><li>Publish the module in a template position and assign it to the pages you want.</li></ol>"
MOD_PPOSMAP_ABOUT_GOTCHAS_LABEL="Things worth knowing"
MOD_PPOSMAP_ABOUT_GOTCHAS_DESC="<ul><li><strong>A point without coordinates does not exist.</strong> A row with an empty latitude or longitude is skipped entirely: it reaches neither the map, nor the list, nor the structured data. That is what keeps the list order matching the markers.</li><li><strong>The points list is shown on desktop only.</strong> On phones the module hides it so the map gets the full screen width.</li><li><strong>The point description behaves differently in the popup and in the list.</strong> Simple HTML formatting works in the popup; the list shows plain text truncated to nine words.</li><li><strong>Opening hours are two separate fields.</strong> The first holds the label visitors see, the second the Schema.org machine format for search engines. Filling in only the first is fine if you do not need structured data.</li><li><strong>The button CSS classes replace the module styling completely.</strong> Entering e.g. btn btn-primary makes the button take its look from the template instead of mixing it with the module's own styling.</li><li><strong>The marker anchor decides which part of the image points at the coordinates.</strong> Choose Bottom for a classic pin with a tip, Centre for a round marker.</li><li><strong>After updating the module, reload the page bypassing the cache</strong> (Ctrl+Shift+R). The module stamps its CSS and JS files with a version number, but the browser may already have cached the previous address.</li></ul>"
MOD_PPOSMAP_ABOUT_TILES_LABEL="Tile server and attribution (Leaflet mode)"
MOD_PPOSMAP_ABOUT_TILES_DESC="<p>Swapping the tile server URL changes how the map looks, but <strong>it does not change the copyright notice in its corner</strong>. By default the module shows the OpenStreetMap attribution, which stops being true once you change provider.</p><p>Attribution is a licence condition for most tile providers, so after entering your own URL fill in the <strong>Tile attribution</strong> field as well. If it is missing, the module logs a warning to the browser console.</p><p>Ready-made URLs and their matching attributions are in the module README and on the <a target='_blank' rel='noreferrer' href='https://leaflet-extras.github.io/leaflet-providers/preview/'>leaflet-providers</a> page. While you are there, set the tile max zoom: above the level your provider supports, the map shows grey squares instead of imagery.</p>"
MOD_PPOSMAP_ABOUT_SCHEMA_LABEL="Structured data (Schema.org)"
MOD_PPOSMAP_ABOUT_SCHEMA_DESC="<p>The module can add an invisible JSON-LD marker listing your locations. Search engines read the address, coordinates, opening hours and phone number from it.</p><ul><li><strong>Turn on the own-locations option only for your own premises.</strong> Linking to the organisation running the site makes sense for branches and pickup points. For a map of independent businesses, such as a directory, leave it off.</li><li><strong>If the module is assigned to all pages, pick a single page</strong> in the menu item field. Repeating the same locations on every page of the site does not help in search results.</li><li><strong>Choose the point type truthfully.</strong> Place and Tourist attraction describe the location itself; the other types also assert a business activity.</li><li>Check the result with the <a target='_blank' rel='noreferrer' href='https://search.google.com/test/rich-results'>Rich Results Test</a> or the <a target='_blank' rel='noreferrer' href='https://validator.schema.org/'>Schema.org validator</a>.</li></ul>"
MOD_PPOSMAP_ABOUT_UPDATES_LABEL="Updates"
MOD_PPOSMAP_ABOUT_UPDATES_DESC="<p><strong>Yes, the module has its own update server.</strong> Joomla checks for a newer version by itself and lists it in the panel just like updates for extensions from the directory. Installing takes a click, because Joomla does not update extensions without confirmation.</p><ul><li>Go to <strong>System &rarr; Update &rarr; Extensions</strong>. The <strong>Check For Updates</strong> button forces an immediate check, bypassing the cached response.</li><li>Joomla downloads the package from GitHub and compares its SHA-256 checksum against the value given by the update server, so a file damaged or swapped in transit will not be installed.</li><li>An update overwrites the module files and keeps both the settings and the points you added.</li><li>Release list and changelog: <a target='_blank' rel='noreferrer' href='https://github.com/pablop76/mod_pposmap/releases'>github.com/pablop76/mod_pposmap</a>.</li></ul>"
