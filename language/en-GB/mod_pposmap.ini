MOD_PPOSMAP_MAP_HEIGHT="Map height"
MOD_PPOSMAP_MAP_HEIGHT_DESC="Optional. Examples: 500px, 70vh, 100%. If empty, the default height from CSS is used."
MOD_PPOSMAP_MAP_HEIGHT_MOBILE="Map height (mobile)"
MOD_PPOSMAP_MAP_HEIGHT_MOBILE_DESC="Optional. Examples: 400px or 60vh. If empty, the 'Map height' value is used (or a safe minimum)."
MOD_PPOSMAP_ADD_SCHEMA="Add structured data (Schema.org)"
MOD_PPOSMAP_ADD_SCHEMA_DESC="Adds an invisible JSON-LD (Schema.org) marker with the list of points for search engines. Disable if you already have your own structured data for these locations."
MOD_PPOSMAP_STREET_ADDRESS="Street address"
MOD_PPOSMAP_STREET_ADDRESS_DESC="For structured data. Street and number only, without postcode and town."
MOD_PPOSMAP_POSTAL_CODE="Postcode"
MOD_PPOSMAP_ADDRESS_LOCALITY="Town or city"
MOD_PPOSMAP_SCHEMA_OPENING_HOURS="Opening hours in Schema.org format"
MOD_PPOSMAP_SCHEMA_OPENING_HOURS_DESC="For structured data, machine format, one rule per line. Two-letter days: Mo, Tu, We, Th, Fr, Sa, Su. Example: Mo-Fr 09:00-17:00 on the first line and Sa 10:00-14:00 on the second. The module expands this into a full opening hours specification, so it works for every object type. The label shown to visitors goes in the 'Opening hours' field above. A line in any other format is skipped."
MOD_PPOSMAP_POINT_URL="Location page URL"
MOD_PPOSMAP_POINT_URL_DESC="For structured data. Link to a page describing this location, if one exists."
MOD_PPOSMAP_SCHEMA_TYPE="Structured data type for points"
MOD_PPOSMAP_SCHEMA_TYPE_DESC="What the points on the map are. 'Place' and 'Tourist attraction' describe a location; the other types also state a business activity and only they can be tied to an organisation. Do not mark up as a business any point you do not own."
MOD_PPOSMAP_SCHEMA_TYPE_PLACE="Place"
MOD_PPOSMAP_SCHEMA_TYPE_TOURISTATTRACTION="Tourist attraction"
MOD_PPOSMAP_SCHEMA_TYPE_LOCALBUSINESS="Local business"
MOD_PPOSMAP_SCHEMA_TYPE_STORE="Store"
MOD_PPOSMAP_SCHEMA_TYPE_RESTAURANT="Restaurant"
MOD_PPOSMAP_SCHEMA_TYPE_MEDICALBUSINESS="Medical business"
MOD_PPOSMAP_SCHEMA_TYPE_AUTOMOTIVEBUSINESS="Automotive business"
MOD_PPOSMAP_SCHEMA_TYPE_PROFESSIONALSERVICE="Professional service"
MOD_PPOSMAP_SCHEMA_TYPE_LODGINGBUSINESS="Lodging business"
MOD_PPOSMAP_SCHEMA_MENU_ITEMS="Emit structured data only on these pages"
MOD_PPOSMAP_SCHEMA_MENU_ITEMS_DESC="Optional. If empty, the markup appears everywhere the module is displayed. If the module is assigned to all pages, pick a single page here: repeating the same locations on every page of the site is undesirable, because business data belongs on the page that actually describes it."
MOD_PPOSMAP_SCHEMA_OWN_LOCATIONS="These are my own locations"
MOD_PPOSMAP_SCHEMA_OWN_LOCATIONS_DESC="Enable only when the points are branches, pickup points or premises of the entity running this site. The module then adds an Organization node and links every point to it. For a map of independent businesses, such as a directory, leave this off: tying someone else's business to your organisation would misrepresent it to search engines."
MOD_PPOSMAP_SAME_AS="External profiles of this point"
MOD_PPOSMAP_SAME_AS_DESC="For structured data. URLs describing the same location elsewhere, e.g. a Google Business Profile or a Facebook page. One URL per line."
MOD_PPOSMAP_ADDRESS_COUNTRY="Country"
MOD_PPOSMAP_ADDRESS_COUNTRY_DESC="For structured data, shared by all points. Two-letter ISO code, e.g. GB. If empty, no country is emitted."
MOD_PPOSMAP_VIEW_BUTTON="VIEW"
MOD_PPOSMAP_LIST_WIDTH="Points list width"
MOD_PPOSMAP_LIST_WIDTH_DESC="Optional. Examples: 300px, 25rem or 25%. Defaults to 300px. A column that is too narrow breaks the address and the button across several lines."
MOD_PPOSMAP_VIEW_BUTTON_TEXT="Button label"
MOD_PPOSMAP_VIEW_BUTTON_TEXT_DESC="Optional. If empty, the label from the translation is used ('VIEW' by default)."
MOD_PPOSMAP_VIEW_BUTTON_CLASS="Button CSS classes"
MOD_PPOSMAP_VIEW_BUTTON_CLASS_DESC="Optional. If empty, the button gets the module's own neutral styling. Entering classes replaces it entirely so styles do not clash: for a Bootstrap template use e.g. btn btn-primary."
MOD_PPOSMAP_CLUSTER_MARKERS="Cluster nearby markers"
MOD_PPOSMAP_CLUSTER_MARKERS_DESC="When many points are close together, groups them into a single marker with a count — clicking zooms in. Recommended for more than a dozen or so points."
MOD_PPOSMAP_FIELDSET_ABOUT="About"
MOD_PPOSMAP_ABOUT_INTRO_LABEL="Map with points"
MOD_PPOSMAP_ABOUT_INTRO_DESC="<p>The module shows a map with marked locations and an optional list of points beside it. Clicking a marker opens a popup with the title, description, image, opening hours and phone number.</p><p>Two map providers are available. <strong>Leaflet</strong> draws the map on OpenStreetMap tiles and works straight away, with no account needed. <strong>Mapbox</strong> offers richer styles and smoother animation, but requires a free token and has a view limit on the free plan.</p>"
MOD_PPOSMAP_ABOUT_START_LABEL="Getting started"
MOD_PPOSMAP_ABOUT_START_DESC="<ol><li>On the <strong>Module</strong> tab pick a map provider. For Mapbox paste your token; for Leaflet nothing else is needed.</li><li>Add locations with the <strong>Add another point on the map</strong> button. Only the coordinates are required, fill in the rest as needed.</li><li>You can read coordinates off Google Maps: right-click the spot and the first entry in the menu is the latitude and longitude. They are also available from <a target='_blank' rel='noreferrer' href='https://www.latlong.net/'>latlong.net</a>.</li><li>On the <strong>Map settings</strong> tab set the zoom, the map height and the marker appearance.</li><li>Publish the module in a template position and assign it to the pages you want.</li></ol>"
MOD_PPOSMAP_ABOUT_GOTCHAS_LABEL="Things worth knowing"
MOD_PPOSMAP_ABOUT_GOTCHAS_DESC="<ul><li><strong>A point without coordinates does not exist.</strong> A row with an empty latitude or longitude is skipped entirely: it reaches neither the map, nor the list, nor the structured data. That is what keeps the list order matching the markers.</li><li><strong>The points list is shown on desktop only.</strong> On phones the module hides it so the map gets the full screen width.</li><li><strong>The point description behaves differently in the popup and in the list.</strong> Simple HTML formatting works in the popup; the list shows plain text truncated to nine words.</li><li><strong>Opening hours are two separate fields.</strong> The first holds the label visitors see, the second the Schema.org machine format for search engines. Filling in only the first is fine if you do not need structured data.</li><li><strong>The button CSS classes replace the module styling completely.</strong> Entering e.g. btn btn-primary makes the button take its look from the template instead of mixing it with the module's own styling.</li><li><strong>The marker anchor decides which part of the image points at the coordinates.</strong> Choose Bottom for a classic pin with a tip, Centre for a round marker.</li><li><strong>After updating the module, reload the page bypassing the cache</strong> (Ctrl+Shift+R). The module stamps its CSS and JS files with a version number, but the browser may already have cached the previous address.</li></ul>"
MOD_PPOSMAP_ABOUT_TILES_LABEL="Tile server and attribution (Leaflet mode)"
MOD_PPOSMAP_ABOUT_TILES_DESC="<p>Swapping the tile server URL changes how the map looks, but <strong>it does not change the copyright notice in its corner</strong>. By default the module shows the OpenStreetMap attribution, which stops being true once you change provider.</p><p>Attribution is a licence condition for most tile providers, so after entering your own URL fill in the <strong>Tile attribution</strong> field as well. If it is missing, the module logs a warning to the browser console.</p><p>Ready-made URLs and their matching attributions are in the module README and on the <a target='_blank' rel='noreferrer' href='https://leaflet-extras.github.io/leaflet-providers/preview/'>leaflet-providers</a> page. While you are there, set the tile max zoom: above the level your provider supports, the map shows grey squares instead of imagery.</p>"
MOD_PPOSMAP_ABOUT_SCHEMA_LABEL="Structured data (Schema.org)"
MOD_PPOSMAP_ABOUT_SCHEMA_DESC="<p>The module can add an invisible JSON-LD marker listing your locations. Search engines read the address, coordinates, opening hours and phone number from it.</p><ul><li><strong>Turn on the own-locations option only for your own premises.</strong> Linking to the organisation running the site makes sense for branches and pickup points. For a map of independent businesses, such as a directory, leave it off.</li><li><strong>If the module is assigned to all pages, pick a single page</strong> in the menu item field. Repeating the same locations on every page of the site does not help in search results.</li><li><strong>Choose the point type truthfully.</strong> Place and Tourist attraction describe the location itself; the other types also assert a business activity.</li><li>Check the result with the <a target='_blank' rel='noreferrer' href='https://search.google.com/test/rich-results'>Rich Results Test</a> or the <a target='_blank' rel='noreferrer' href='https://validator.schema.org/'>Schema.org validator</a>.</li></ul>"
MOD_PPOSMAP_ABOUT_UPDATES_LABEL="Updates"
MOD_PPOSMAP_ABOUT_UPDATES_DESC="<p><strong>Yes, the module has its own update server.</strong> Joomla checks for a newer version by itself and lists it in the panel just like updates for extensions from the directory. Installing takes a click, because Joomla does not update extensions without confirmation.</p><ul><li>Go to <strong>System &rarr; Update &rarr; Extensions</strong>. The <strong>Check For Updates</strong> button forces an immediate check, bypassing the cached response.</li><li>Joomla downloads the package from GitHub and compares its SHA-256 checksum against the value given by the update server, so a file damaged or swapped in transit will not be installed.</li><li>An update overwrites the module files and keeps both the settings and the points you added.</li><li>Release list and changelog: <a target='_blank' rel='noreferrer' href='https://github.com/pablop76/mod_pposmap/releases'>github.com/pablop76/mod_pposmap</a>.</li></ul>"
