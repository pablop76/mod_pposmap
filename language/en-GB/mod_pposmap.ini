; language strings used inside mod_pposmap 
MOD_PPOSMAP_NAME="Map with points"
MOD_PPOSMAP_DESCRIPTION="Displays a map with markers and an optional list of locations. Choose between Mapbox and Leaflet with OpenStreetMap."
MOD_PPOSMAP_DESRIPTION_GROUPS="Show the option to sort points by the set group name"
MOD_PPOSMAP_TOKEN_MAPBOX="Add <a target='_blank' rel='noreferrer' href='https://www.mapbox.com/studio/account/tokens'>Token Mapbox</a>"
MOD_PPOSMAP_STYLE_MAPBOX="Add a custom <a target='_blank' rel='noreferrer' href='https://docs.mapbox.com/studio-manual/guides/map-styling/#template-styles'>Mapbox style</a>"
MOD_PPOSMAP_LONGITUDE="Longitude"
MOD_PPOSMAP_LATITUDE="Latitude"
MOD_PPOSMAP_OPENINGHOURS="Opening hours"
MOD_PPOSMAP_TELEPHONE="Phone number"
MOD_PPOSMAP_ZOOM="Default zoom"
MOD_PPOSMAP_GEOTITLE="Marker title"
MOD_PPOSMAP_GEODESCRIPTION="Marker description"
MOD_PPOSMAP_MARKER="Default marker icon"
MOD_PPOSMAP_MARKER_DESC="Optional. Used for every point that has no marker of its own. If empty, the default marker of the selected map provider is shown."
MOD_PPOSMAP_MARKER_WIDTH="Marker width (px)"
MOD_PPOSMAP_MARKER_WIDTH_DESC="Optional. Defaults to 50 px. The image is fitted inside a box of the given size while keeping its aspect ratio, so it is never distorted."
MOD_PPOSMAP_MARKER_HEIGHT="Marker height (px)"
MOD_PPOSMAP_MARKER_HEIGHT_DESC="Optional. Defaults to 64 px."
MOD_PPOSMAP_MARKER_ANCHOR="Marker anchor point"
MOD_PPOSMAP_MARKER_ANCHOR_DESC="The part of the image that points at the exact coordinates. Choose 'Bottom' for a classic pin with a tip, 'Centre' for a round marker."
MOD_PPOSMAP_MARKER_ANCHOR_BOTTOM="Bottom (pin tip)"
MOD_PPOSMAP_MARKER_ANCHOR_CENTER="Centre"
MOD_PPOSMAP_MARKER_ANCHOR_TOP="Top"
MOD_PPOSMAP_POPUP_IMAGE="Popup image"
MOD_PPOSMAP_POPUP_IMAGE_DESC="Optional. Image shown in the popup after clicking the marker."
MOD_PPOSMAP_POINT_MARKER="Marker icon for this point"
MOD_PPOSMAP_POINT_MARKER_DESC="Optional. Overrides the default marker from the map settings for this single point. Useful to tell e.g. a head office apart from pickup points."
MOD_PPOSMAP_SUBFORM_FIELD="Add another <a target='_blank' rel='noreferrer' href='https://www.latlong.net/'>point on the map</a>"
MOD_PPOSMAP_SUBFORM_FIELD_DESC="Each row is one marker on the map. Only the coordinates are required, all other fields are optional."
MOD_PPOSMAP_SHOW_LIST_POINTS="Show points list"
MOD_PPOSMAP_SHOW_LIST_POINTS_DESC="The points list is shown on desktop only (it is hidden on mobile)."
MOD_PPOSMAP_TILE_URL="Tile server URL"
MOD_PPOSMAP_TILE_URL_DESC="Optional. URL template with {z}/{x}/{y} placeholders, e.g. https://tile.openstreetmap.org/{z}/{x}/{y}.png. Append an API key as a query parameter, e.g. ?apikey=YOUR_KEY. If empty, OpenStreetMap tiles are used. When you change the provider, fill in the 'Tile attribution' field as well, because the default OpenStreetMap attribution no longer applies. Style preview and ready-made URLs: <a target='_blank' rel='noreferrer' href='https://leaflet-extras.github.io/leaflet-providers/preview/'>leaflet-providers</a>."
MOD_PPOSMAP_TILE_ATTRIBUTION="Tile attribution"
MOD_PPOSMAP_TILE_ATTRIBUTION_DESC="Optional. Copyright notice shown in the map corner, HTML links allowed. Required by most tile providers. If empty, the OpenStreetMap attribution is shown."
MOD_PPOSMAP_TILE_MIN_ZOOM="Tile min zoom"
MOD_PPOSMAP_TILE_MIN_ZOOM_DESC="Optional. Lowest zoom level supported by the tile provider. If empty, the Leaflet default applies."
MOD_PPOSMAP_TILE_MAX_ZOOM="Tile max zoom"
MOD_PPOSMAP_TILE_MAX_ZOOM_DESC="Optional. Highest zoom level supported by the provider. Beyond it the map shows grey squares instead of tiles. OpenStreetMap supports 19."
MOD_PPOSMAP_CHOICEMAPBOXLEAFLET="Provider"
MOD_PPOSMAP_MAPBOXCHOICE="Mapbox"
MOD_PPOSMAP_LEAFLETCHOICE="Leaflet"
MOD_PPOSMAP_FIELDSET_DISPLAY="Map settings"
MOD_PPOSMAP_LAYER_GROUPS="Layer Groups"
MOD_PPOSMAP_LAYER_GROUP_NAME="Group name"
MOD_PPOSMAP_GROUP_LEAFLET_ALL="All"
MOD_PPOSMAP_MAP_HEIGHT="Map height"
MOD_PPOSMAP_MAP_HEIGHT_DESC="Optional. Examples: 500px, 70vh, 100%. If empty, the default height from CSS is used."
MOD_PPOSMAP_MAP_HEIGHT_MOBILE="Map height (mobile)"
MOD_PPOSMAP_MAP_HEIGHT_MOBILE_DESC="Optional. Examples: 400px or 60vh. If empty, the 'Map height' value is used (or a safe minimum)."
MOD_PPOSMAP_ADD_SCHEMA="Add structured data (Schema.org)"
MOD_PPOSMAP_ADD_SCHEMA_DESC="Adds an invisible JSON-LD (Schema.org) marker with the list of points for search engines. Disable if you already have your own structured data for these locations."
MOD_PPOSMAP_STREET_ADDRESS="Street address"
MOD_PPOSMAP_STREET_ADDRESS_DESC="For structured data. Street and number only, without postcode and town."
MOD_PPOSMAP_POSTAL_CODE="Postcode"
MOD_PPOSMAP_ADDRESS_LOCALITY="Town or city"
MOD_PPOSMAP_SCHEMA_OPENING_HOURS="Opening hours in Schema.org format"
MOD_PPOSMAP_SCHEMA_OPENING_HOURS_DESC="For structured data, machine format, one rule per line. Two-letter days: Mo, Tu, We, Th, Fr, Sa, Su. Example: Mo-Fr 09:00-17:00 on the first line and Sa 10:00-14:00 on the second. The module expands this into a full opening hours specification, so it works for every object type. The label shown to visitors goes in the 'Opening hours' field above. A line in any other format is skipped."
MOD_PPOSMAP_POINT_URL="Location page URL"
MOD_PPOSMAP_POINT_URL_DESC="For structured data. Link to a page describing this location, if one exists."
MOD_PPOSMAP_SCHEMA_TYPE="Structured data type for points"
MOD_PPOSMAP_SCHEMA_TYPE_DESC="What the points on the map are. 'Place' and 'Tourist attraction' describe a location; the other types also state a business activity and only they can be tied to an organisation. Do not mark up as a business any point you do not own."
MOD_PPOSMAP_SCHEMA_TYPE_PLACE="Place"
MOD_PPOSMAP_SCHEMA_TYPE_TOURISTATTRACTION="Tourist attraction"
MOD_PPOSMAP_SCHEMA_TYPE_LOCALBUSINESS="Local business"
MOD_PPOSMAP_SCHEMA_TYPE_STORE="Store"
MOD_PPOSMAP_SCHEMA_TYPE_RESTAURANT="Restaurant"
MOD_PPOSMAP_SCHEMA_TYPE_MEDICALBUSINESS="Medical business"
MOD_PPOSMAP_SCHEMA_TYPE_AUTOMOTIVEBUSINESS="Automotive business"
MOD_PPOSMAP_SCHEMA_TYPE_PROFESSIONALSERVICE="Professional service"
MOD_PPOSMAP_SCHEMA_TYPE_LODGINGBUSINESS="Lodging business"
MOD_PPOSMAP_SCHEMA_MENU_ITEMS="Emit structured data only on these pages"
MOD_PPOSMAP_SCHEMA_MENU_ITEMS_DESC="Optional. If empty, the markup appears everywhere the module is displayed. If the module is assigned to all pages, pick a single page here: repeating the same locations on every page of the site is undesirable, because business data belongs on the page that actually describes it."
MOD_PPOSMAP_SCHEMA_OWN_LOCATIONS="These are my own locations"
MOD_PPOSMAP_SCHEMA_OWN_LOCATIONS_DESC="Enable only when the points are branches, pickup points or premises of the entity running this site. The module then adds an Organization node and links every point to it. For a map of independent businesses, such as a directory, leave this off: tying someone else's business to your organisation would misrepresent it to search engines."
MOD_PPOSMAP_SAME_AS="External profiles of this point"
MOD_PPOSMAP_SAME_AS_DESC="For structured data. URLs describing the same location elsewhere, e.g. a Google Business Profile or a Facebook page. One URL per line."
MOD_PPOSMAP_ADDRESS_COUNTRY="Country"
MOD_PPOSMAP_ADDRESS_COUNTRY_DESC="For structured data, shared by all points. Two-letter ISO code, e.g. GB. If empty, no country is emitted."
MOD_PPOSMAP_VIEW_BUTTON="VIEW"
MOD_PPOSMAP_LIST_WIDTH="Points list width"
MOD_PPOSMAP_LIST_WIDTH_DESC="Optional. Examples: 300px, 25rem or 25%. Defaults to 300px. A column that is too narrow breaks the address and the button across several lines."
MOD_PPOSMAP_VIEW_BUTTON_TEXT="Button label"
MOD_PPOSMAP_VIEW_BUTTON_TEXT_DESC="Optional. If empty, the label from the translation is used ('VIEW' by default)."
MOD_PPOSMAP_VIEW_BUTTON_CLASS="Button CSS classes"
MOD_PPOSMAP_VIEW_BUTTON_CLASS_DESC="Optional. If empty, the button gets the module's own neutral styling. Entering classes replaces it entirely so styles do not clash: for a Bootstrap template use e.g. btn btn-primary."
MOD_PPOSMAP_CLUSTER_MARKERS="Cluster nearby markers"
MOD_PPOSMAP_CLUSTER_MARKERS_DESC="When many points are close together, groups them into a single marker with a count — clicking zooms in. Recommended for more than a dozen or so points."
MOD_PPOSMAP_FIELDSET_ABOUT="About"
MOD_PPOSMAP_CREDIT_LABEL="mod_pposmap v1.1.4"
MOD_PPOSMAP_CREDIT_DESC="Author: pablop76 — <a href='https://web-service.com.pl/' target='_blank' rel='noreferrer'>web-service.com.pl</a>"