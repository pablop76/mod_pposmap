; language strings used inside mod_pposmap 
MOD_PPOSMAP_NAME="Mapa z punktami"
MOD_PPOSMAP_DESCRIPTION="Wyświetla mapę z zaznaczonymi punktami i opcjonalną listą lokalizacji. Do wyboru Mapbox albo Leaflet z OpenStreetMap."
MOD_PPOSMAP_DESRIPTION_GROUPS="Pokaż możliwość sortowania punktów według ustawionej nazwy grupy"
MOD_PPOSMAP_TOKEN_MAPBOX="Dodaj swój <a target='_blank' rel='noreferrer' href='https://www.mapbox.com/studio/account/tokens'>token do Mapbox</a>"
MOD_PPOSMAP_STYLE_MAPBOX="Dodaj własne <a target='_blank' rel='noreferrer' href='https://docs.mapbox.com/studio-manual/guides/map-styling/#template-styles'>style Mapbox</a>"
MOD_PPOSMAP_LONGITUDE="Dodaj długość geograficzną punktu"
MOD_PPOSMAP_LATITUDE="Dodaj szerokość geograficzną punktu"
MOD_PPOSMAP_OPENINGHOURS="Dodaj godziny otwarcia"
MOD_PPOSMAP_TELEPHONE="Dodaj numer telefonu"
MOD_PPOSMAP_ZOOM="Ustaw zoom dla mapy"
MOD_PPOSMAP_GEOTITLE="Dodaj tytuł markera na mapie"
MOD_PPOSMAP_GEODESCRIPTION="Dodaj krótki opis na markerze mapy"
MOD_PPOSMAP_GEODESCRIPTION_DESC="W dymku na mapie działa proste formatowanie HTML, np. &lt;strong&gt;pogrubienie&lt;/strong&gt;, &lt;em&gt;kursywa&lt;/em&gt;, &lt;a href&gt;odnośnik&lt;/a&gt; albo lista. Na liście punktów obok mapy pokazywany jest sam tekst bez znaczników, bo jest tam skracany."
MOD_PPOSMAP_OPENINGHOURS_DESC="Napis widoczny dla odwiedzających. Każdy wiersz pokaże się w osobnej linii. Wersję dla wyszukiwarek wypełnij niżej, w polu z formatem Schema.org."
MOD_PPOSMAP_MARKER="Domyślna pinezka"
MOD_PPOSMAP_MARKER_DESC="Opcjonalnie. Pinezka używana dla wszystkich punktów, które nie mają ustawionej własnej. Gdy puste, moduł pokaże domyślny znacznik wybranego dostawcy mapy."
MOD_PPOSMAP_MARKER_WIDTH="Szerokość pinezki (px)"
MOD_PPOSMAP_MARKER_WIDTH_DESC="Opcjonalnie. Gdy puste, obowiązuje 50 px. Obrazek jest wpisywany w prostokąt o podanych wymiarach z zachowaniem proporcji, więc nie zostanie zniekształcony."
MOD_PPOSMAP_MARKER_HEIGHT="Wysokość pinezki (px)"
MOD_PPOSMAP_MARKER_HEIGHT_DESC="Opcjonalnie. Gdy puste, obowiązuje 64 px."
MOD_PPOSMAP_MARKER_ANCHOR="Punkt zaczepienia pinezki"
MOD_PPOSMAP_MARKER_ANCHOR_DESC="Miejsce obrazka, które ma wskazywać dokładne współrzędne punktu. Dla klasycznej pinezki z czubkiem wybierz „Dół”, dla okrągłego znacznika „Środek”."
MOD_PPOSMAP_MARKER_ANCHOR_BOTTOM="Dół (czubek pinezki)"
MOD_PPOSMAP_MARKER_ANCHOR_CENTER="Środek"
MOD_PPOSMAP_MARKER_ANCHOR_TOP="Góra"
MOD_PPOSMAP_POPUP_IMAGE="Zdjęcie w dymku punktu"
MOD_PPOSMAP_POPUP_IMAGE_DESC="Opcjonalnie. Zdjęcie pokazywane w dymku po kliknięciu pinezki."
MOD_PPOSMAP_POINT_MARKER="Własna pinezka tego punktu"
MOD_PPOSMAP_POINT_MARKER_DESC="Opcjonalnie. Zastępuje domyślną pinezkę z ustawień mapy tylko dla tego jednego punktu. Przydatne, gdy chcesz odróżnić np. siedzibę od punktów odbioru."
MOD_PPOSMAP_SUBFORM_FIELD="Dodaj kolejny <a target='_blank' rel='noreferrer' href='https://www.latlong.net/'>punkt na mapie</a>"
MOD_PPOSMAP_SUBFORM_FIELD_DESC="Każdy wiersz to jeden znacznik na mapie. Wymagane są tylko współrzędne, reszta pól jest opcjonalna."
MOD_PPOSMAP_SHOW_LIST_POINTS="Dodaj listę punktów jako opis mapy (tylko na desktop)"
MOD_PPOSMAP_SHOW_LIST_POINTS_DESC="Lista punktów jest widoczna tylko na desktop (na mobile jest ukryta)."
MOD_PPOSMAP_TILE_URL="Adres serwera kafelków"
MOD_PPOSMAP_TILE_URL_DESC="Opcjonalnie. Szablon adresu z polami {z}/{x}/{y}, np. https://tile.openstreetmap.org/{z}/{x}/{y}.png. Klucz API dopisz na końcu jako parametr, np. ?apikey=TWOJ_KLUCZ. Gdy puste, moduł użyje kafelków OpenStreetMap. Po zmianie dostawcy uzupełnij też pole „Atrybucja kafelków”, bo domyślna atrybucja OpenStreetMap przestaje być prawdziwa. Podgląd stylów i gotowe adresy: <a target='_blank' rel='noreferrer' href='https://leaflet-extras.github.io/leaflet-providers/preview/'>leaflet-providers</a>."
MOD_PPOSMAP_TILE_ATTRIBUTION="Atrybucja kafelków"
MOD_PPOSMAP_TILE_ATTRIBUTION_DESC="Opcjonalnie. Napis o prawach autorskich w rogu mapy, dozwolone odnośniki HTML. Wymagany przez większość dostawców kafelków. Gdy puste, moduł pokaże atrybucję OpenStreetMap."
MOD_PPOSMAP_TILE_MIN_ZOOM="Minimalne przybliżenie kafelków"
MOD_PPOSMAP_TILE_MIN_ZOOM_DESC="Opcjonalnie. Najmniejsze przybliżenie obsługiwane przez dostawcę kafelków. Gdy puste, obowiązuje domyślne ustawienie Leafletu."
MOD_PPOSMAP_TILE_MAX_ZOOM="Maksymalne przybliżenie kafelków"
MOD_PPOSMAP_TILE_MAX_ZOOM_DESC="Opcjonalnie. Największe przybliżenie obsługiwane przez dostawcę. Powyżej tej wartości mapa pokazuje szare pola zamiast kafelków. OpenStreetMap obsługuje 19."
MOD_PPOSMAP_CHOICEMAPBOXLEAFLET="Dostawca"
MOD_PPOSMAP_MAPBOXCHOICE="Mapbox"
MOD_PPOSMAP_LEAFLETCHOICE="Leaflet"
MOD_PPOSMAP_FIELDSET_DISPLAY="Ustawienia mapy"
MOD_PPOSMAP_LAYER_GROUPS="Kontrola grup na mapie"
MOD_PPOSMAP_LAYER_GROUP_NAME="Nazwa grupy"
MOD_PPOSMAP_GROUP_LEAFLET_ALL="Wszystkie"
MOD_PPOSMAP_MAP_HEIGHT="Wysokość mapy"
MOD_PPOSMAP_MAP_HEIGHT_DESC="Opcjonalnie. Podaj np. 500px, 70vh, 100%. Gdy puste, użyta będzie domyślna wysokość z CSS."
MOD_PPOSMAP_MAP_HEIGHT_MOBILE="Wysokość mapy (mobile)"
MOD_PPOSMAP_MAP_HEIGHT_MOBILE_DESC="Opcjonalnie. Podaj np. 400px lub 60vh. Gdy puste, użyta będzie wysokość z pola 'Wysokość mapy' lub bezpieczne minimum."
MOD_PPOSMAP_ADD_SCHEMA="Dodaj dane strukturalne (Schema.org)"
MOD_PPOSMAP_ADD_SCHEMA_DESC="Dodaje niewidoczny znacznik JSON-LD (Schema.org) z listą punktów dla wyszukiwarek. Wyłącz, jeśli masz już własne dane strukturalne dla tych lokalizacji."
MOD_PPOSMAP_STREET_ADDRESS="Ulica i numer"
MOD_PPOSMAP_STREET_ADDRESS_DESC="Do danych strukturalnych. Sam adres, bez kodu i miejscowości, np. plac Defilad 1."
MOD_PPOSMAP_POSTAL_CODE="Kod pocztowy"
MOD_PPOSMAP_ADDRESS_LOCALITY="Miejscowość"
MOD_PPOSMAP_SCHEMA_OPENING_HOURS="Godziny otwarcia w formacie Schema.org"
MOD_PPOSMAP_SCHEMA_OPENING_HOURS_DESC="Do danych strukturalnych, format maszynowy, jedna reguła w wierszu. Dni po angielsku dwuliterowo: Mo, Tu, We, Th, Fr, Sa, Su. Przykład: Mo-Fr 09:00-17:00, a w drugim wierszu Sa 10:00-14:00. Moduł rozwija to na pełną specyfikację godzin, więc działa dla każdego typu obiektu. Napis widoczny dla odwiedzających wypełnij wyżej, w polu „Dodaj godziny otwarcia”. Wiersz w innym formacie zostanie pominięty."
MOD_PPOSMAP_POINT_URL="Adres strony punktu"
MOD_PPOSMAP_POINT_URL_DESC="Do danych strukturalnych. Odnośnik do podstrony opisującej tę lokalizację, jeśli taka istnieje."
MOD_PPOSMAP_SCHEMA_TYPE="Typ punktów w danych strukturalnych"
MOD_PPOSMAP_SCHEMA_TYPE_DESC="Czym są punkty na mapie. „Miejsce” i „Atrakcja turystyczna” opisują lokalizację; pozostałe typy oznaczają dodatkowo działalność gospodarczą i tylko one mogą być powiązane z organizacją. Nie oznaczaj jako firmy punktów, które do ciebie nie należą."
MOD_PPOSMAP_SCHEMA_TYPE_PLACE="Miejsce (Place)"
MOD_PPOSMAP_SCHEMA_TYPE_TOURISTATTRACTION="Atrakcja turystyczna (TouristAttraction)"
MOD_PPOSMAP_SCHEMA_TYPE_LOCALBUSINESS="Firma lokalna (LocalBusiness)"
MOD_PPOSMAP_SCHEMA_TYPE_STORE="Sklep (Store)"
MOD_PPOSMAP_SCHEMA_TYPE_RESTAURANT="Restauracja (Restaurant)"
MOD_PPOSMAP_SCHEMA_TYPE_MEDICALBUSINESS="Placówka medyczna (MedicalBusiness)"
MOD_PPOSMAP_SCHEMA_TYPE_AUTOMOTIVEBUSINESS="Branża motoryzacyjna (AutomotiveBusiness)"
MOD_PPOSMAP_SCHEMA_TYPE_PROFESSIONALSERVICE="Usługi profesjonalne (ProfessionalService)"
MOD_PPOSMAP_SCHEMA_TYPE_LODGINGBUSINESS="Nocleg (LodgingBusiness)"
MOD_PPOSMAP_SCHEMA_MENU_ITEMS="Wypisuj dane strukturalne tylko na tych stronach"
MOD_PPOSMAP_SCHEMA_MENU_ITEMS_DESC="Opcjonalnie. Gdy puste, znacznik pojawia się wszędzie, gdzie moduł jest wyświetlany. Jeśli moduł jest przypisany do wszystkich stron, wskaż tu jedną podstronę: powielanie tych samych lokalizacji na każdej stronie witryny jest niepożądane, bo dane o firmie powinny być tam, gdzie faktycznie ją opisujesz."
MOD_PPOSMAP_SCHEMA_OWN_LOCATIONS="To są lokalizacje mojej firmy"
MOD_PPOSMAP_SCHEMA_OWN_LOCATIONS_DESC="Włącz tylko wtedy, gdy punkty na mapie to oddziały, punkty odbioru albo placówki podmiotu prowadzącego tę stronę. Moduł doda wtedy węzeł Organization i powiąże z nim każdy punkt. Przy mapie niezależnych firm, np. w katalogu, zostaw wyłączone: powiązanie cudzej firmy ze swoją organizacją byłoby nieprawdą wobec wyszukiwarki."
MOD_PPOSMAP_SAME_AS="Profile zewnętrzne punktu"
MOD_PPOSMAP_SAME_AS_DESC="Do danych strukturalnych. Adresy opisujące tę samą lokalizację gdzie indziej, np. wizytówka Google albo profil na Facebooku. Jeden adres w wierszu."
MOD_PPOSMAP_ADDRESS_COUNTRY="Kraj"
MOD_PPOSMAP_ADDRESS_COUNTRY_DESC="Do danych strukturalnych, wspólny dla wszystkich punktów. Dwuliterowy kod ISO, np. PL. Gdy puste, kraj nie trafia do danych."
MOD_PPOSMAP_VIEW_BUTTON="ZOBACZ"
MOD_PPOSMAP_LIST_WIDTH="Szerokość listy punktów"
MOD_PPOSMAP_LIST_WIDTH_DESC="Opcjonalnie. Podaj np. 300px, 25rem albo 25%. Gdy puste, obowiązuje 300 px. Za wąska kolumna łamie adres i przycisk na kilka linii."
MOD_PPOSMAP_VIEW_BUTTON_TEXT="Napis na przycisku"
MOD_PPOSMAP_VIEW_BUTTON_TEXT_DESC="Opcjonalnie. Gdy puste, moduł użyje napisu z tłumaczenia (domyślnie „ZOBACZ”)."
MOD_PPOSMAP_VIEW_BUTTON_CLASS="Klasy CSS przycisku"
MOD_PPOSMAP_VIEW_BUTTON_CLASS_DESC="Opcjonalnie. Gdy puste, przycisk dostaje własny, neutralny styl modułu. Wpisanie klas zastępuje go w całości, żeby style się nie mieszały: dla szablonu na Bootstrapie użyj np. btn btn-primary."
MOD_PPOSMAP_CLUSTER_MARKERS="Grupuj bliskie markery (klastrowanie)"
MOD_PPOSMAP_CLUSTER_MARKERS_DESC="Przy wielu punktach blisko siebie łączy je w jeden znacznik z liczbą — po kliknięciu mapa się przybliża. Zalecane przy więcej niż kilkunastu punktach."
MOD_PPOSMAP_FIELDSET_GEOJSON="GeoJSON"
MOD_PPOSMAP_GEOJSON_SOURCE="Źródło danych GeoJSON"
MOD_PPOSMAP_GEOJSON_SOURCE_DESC="GeoJSON to otwarty format opisujący kształty na mapie: punkty, linie i obszary. Pozwala wgrać wiele lokalizacji naraz zamiast dodawać je pojedynczo, a także narysować rzeczy, których pinezką pokazać się nie da: obszar działania firmy, przebieg trasy czy granicę gminy. Pliki w tym formacie eksportuje między innymi Mapy Google (Moje Mapy), serwis geojson.io i program QGIS."
MOD_PPOSMAP_GEOJSON_SOURCE_NONE="Wyłączone"
MOD_PPOSMAP_GEOJSON_SOURCE_PASTE="Wklejona treść"
MOD_PPOSMAP_GEOJSON_SOURCE_FILE="Plik na serwerze"
MOD_PPOSMAP_GEOJSON_DATA="Treść GeoJSON"
MOD_PPOSMAP_GEOJSON_DATA_DESC="Wklej całą zawartość pliku. Moduł przyjmuje FeatureCollection, pojedynczy obiekt Feature oraz samą geometrię. Przy dużych plikach wybierz wyżej opcję „Plik na serwerze”: treść wklejona tutaj powiększa zapis ustawień w bazie i kod źródłowy każdej strony, na której moduł jest wyświetlany."
MOD_PPOSMAP_GEOJSON_FILE="Ścieżka do pliku"
MOD_PPOSMAP_GEOJSON_FILE_DESC="Ścieżka względem katalogu głównego Joomli, na przykład images/dane/obszary.geojson. Wgraj plik menedżerem multimediów albo przez FTP. Dozwolone rozszerzenia to .geojson i .json, wyłącznie spod katalogu witryny. Adresy zewnętrzne nie są obsługiwane, ponieważ oznaczałyby zapytanie do obcego serwera przy każdym otwarciu strony."
MOD_PPOSMAP_GEOJSON_FIT="Dopasuj widok do danych"
MOD_PPOSMAP_GEOJSON_FIT_DESC="Po wczytaniu mapa sama ustawia środek i przybliżenie tak, żeby zmieściły się wszystkie punkty i obszary. Ustawienie „Zoom” jest wtedy pomijane. Wyłącz, jeśli wolisz sam decydować o kadrze."
MOD_PPOSMAP_GEOJSON_STYLE_LABEL="Wygląd linii i obszarów"
MOD_PPOSMAP_GEOJSON_STYLE_DESC="Ustawienia dotyczą geometrii liniowych i powierzchniowych. Punkty z pliku dostają zwykłą pinezkę modułu, czyli tę z zakładki „Ustawienia mapy”. Jeżeli pojedynczy obiekt w pliku ma własne właściwości stylu w standardzie simplestyle (stroke, stroke-width, stroke-opacity, fill, fill-opacity), mają one pierwszeństwo przed ustawieniami poniżej."
MOD_PPOSMAP_GEOJSON_STROKE="Kolor linii i obrysu"
MOD_PPOSMAP_GEOJSON_STROKE_DESC="Kolor trasy oraz krawędzi obszaru."
MOD_PPOSMAP_GEOJSON_STROKE_WIDTH="Grubość linii (px)"
MOD_PPOSMAP_GEOJSON_STROKE_OPACITY="Krycie linii (0 do 1)"
MOD_PPOSMAP_GEOJSON_FILL="Kolor wypełnienia obszaru"
MOD_PPOSMAP_GEOJSON_FILL_DESC="Dotyczy tylko wielokątów. Linie nie mają wypełnienia."
MOD_PPOSMAP_GEOJSON_FILL_OPACITY="Krycie wypełnienia (0 do 1)"
MOD_PPOSMAP_GEOJSON_FILL_OPACITY_DESC="Wartość 0 daje sam obrys bez wypełnienia, 1 daje obszar całkowicie nieprzezroczysty."
MOD_PPOSMAP_GEOJSON_MAPPING_LABEL="Skąd brać treści dla punktów"
MOD_PPOSMAP_GEOJSON_MAPPING_DESC="Każdy obiekt w pliku ma zestaw właściwości, ale nazywają się one różnie w zależności od programu. Mapy Google zapisują nazwę jako „name”, a eksport z OpenStreetMap adres jako „addr:street”. Wpisz tu nazwy właściwości, których moduł ma szukać. Puste pole oznacza, że dana informacja nie będzie pobierana."
MOD_PPOSMAP_GEOJSON_PROP_TITLE="Właściwość z tytułem"
MOD_PPOSMAP_GEOJSON_PROP_DESCRIPTION="Właściwość z opisem"
MOD_PPOSMAP_GEOJSON_PROP_TELEPHONE="Właściwość z telefonem"
MOD_PPOSMAP_GEOJSON_PROP_OPENINGHOURS="Właściwość z godzinami otwarcia"
MOD_PPOSMAP_GEOJSON_PROP_OPENINGHOURS_DESC="Treść trafia do dymka jako zwykły napis. Do danych strukturalnych nie jest przekazywana, ponieważ wymagają one formatu maszynowego, a pliki rzadko go zachowują."
MOD_PPOSMAP_GEOJSON_PROP_IMAGE="Właściwość ze zdjęciem"
MOD_PPOSMAP_GEOJSON_PROP_IMAGE_DESC="Może zawierać ścieżkę względem katalogu witryny albo pełny adres obcego serwera. Zdjęcia z cudzych serwerów wczytują się wolniej i znikają, gdy tamta strona je usunie."
MOD_PPOSMAP_GEOJSON_PROP_GROUP="Właściwość z nazwą grupy"
MOD_PPOSMAP_GEOJSON_PROP_GROUP_DESC="Opcjonalnie, tylko dla trybu Leaflet z włączoną kontrolą grup. Pozwala rozdzielić punkty z pliku na przełączane warstwy, na przykład według rodzaju obiektu."
MOD_PPOSMAP_GEOJSON_SCHEMA="Dopisz punkty z pliku do danych strukturalnych"
MOD_PPOSMAP_GEOJSON_SCHEMA_DESC="Punkty z pliku trafiają wtedy do bloku Schema.org razem z tymi dodanymi ręcznie. Obiekt bez nazwy jest pomijany zawsze, bo węzeł z samymi współrzędnymi nic wyszukiwarce nie mówi. Linie i obszary nie trafiają do danych strukturalnych w ogóle. Wyłącz, jeżeli plik zawiera cudze obiekty albo dane, za których poprawność nie odpowiadasz."
MOD_PPOSMAP_GEOJSON_PROP_STREET="Właściwość z ulicą i numerem"
MOD_PPOSMAP_GEOJSON_PROP_POSTALCODE="Właściwość z kodem pocztowym"
MOD_PPOSMAP_GEOJSON_PROP_LOCALITY="Właściwość z miejscowością"
MOD_PPOSMAP_GEOJSON_PROP_URL="Właściwość z adresem strony"
MOD_PPOSMAP_ABOUT_GEOJSON_LABEL="Wczytywanie danych z pliku GeoJSON"
MOD_PPOSMAP_ABOUT_GEOJSON_DESC="<p>W zakładce <strong>GeoJSON</strong> moduł potrafi wczytać gotowy plik z danymi mapy. Daje to dwie rzeczy naraz.</p><ul><li><strong>Wiele lokalizacji za jednym razem.</strong> Zamiast dodawać sto punktów ręcznie, wskazujesz jeden plik. Punkty z niego zachowują się dokładnie tak samo jak dodane w zakładce Moduł: mają pinezkę, dymek, pojawiają się na liście obok mapy i mogą trafić do danych strukturalnych.</li><li><strong>Kształty, których pinezka nie pokaże.</strong> Linie i obszary opisują coś, co się ciągnie albo coś, co obejmuje teren: obszar dojazdu, przebieg szlaku, granicę gminy, strefę dostawy.</li></ul><p><strong>Skąd wziąć plik.</strong> Najprościej narysować go w serwisie <a target='_blank' rel='noreferrer' href='https://geojson.io/'>geojson.io</a>, który działa w przeglądarce i nie wymaga zakładania konta. Można też wyeksportować własną mapę z Moich Map Google albo dostać plik od kogoś, kto pracuje w programie QGIS. Granice administracyjne bywają udostępniane publicznie właśnie w tym formacie.</p><ul><li><strong>Kolejność współrzędnych bywa myląca.</strong> W tym formacie zapisuje się najpierw długość, potem szerokość geograficzną, czyli odwrotnie niż w Mapach Google. Punkt, którego współrzędne wychodzą poza dopuszczalny zakres, jest pomijany zamiast lądować w losowym miejscu świata.</li><li><strong>Wygląd pojedynczego obiektu może być zapisany w samym pliku.</strong> Jeśli obiekt ma właściwości standardu simplestyle, moduł je uszanuje, a ustawienia koloru z panelu posłużą tylko obiektom, które własnego stylu nie mają.</li><li><strong>Duży plik lepiej wgrać na serwer, niż wklejać.</strong> Wklejona treść zapisuje się w ustawieniach modułu i powiększa kod źródłowy każdej strony, na której mapa się pokazuje.</li><li><strong>Gdy plik się nie wczyta, mapa działa dalej</strong>, a powód wypisuje konsola przeglądarki (klawisz F12, zakładka Konsola).</li></ul>"
MOD_PPOSMAP_FIELDSET_ABOUT="O module"
MOD_PPOSMAP_ABOUT_INTRO_LABEL="Mapa z punktami"
MOD_PPOSMAP_ABOUT_INTRO_DESC="<p>Moduł pokazuje mapę z zaznaczonymi lokalizacjami i opcjonalną listą punktów obok niej. Kliknięcie pinezki otwiera dymek z tytułem, opisem, zdjęciem, godzinami otwarcia i telefonem.</p><p>Do wyboru są dwaj dostawcy mapy. <strong>Leaflet</strong> rysuje mapę na kafelkach OpenStreetMap i działa od razu, bez zakładania konta. <strong>Mapbox</strong> daje bogatsze style i płynniejszą animację, ale wymaga darmowego tokena i ma limit wyświetleń w darmowym planie.</p>"
MOD_PPOSMAP_ABOUT_START_LABEL="Od czego zacząć"
MOD_PPOSMAP_ABOUT_START_DESC="<ol><li>W zakładce <strong>Moduł</strong> wybierz dostawcę mapy. Dla Mapbox wklej token, dla Leaflet nie musisz nic dopisywać.</li><li>Dodaj lokalizacje przyciskiem <strong>Dodaj kolejny punkt na mapie</strong>. Wymagane są tylko współrzędne, pozostałe pola wypełnij według potrzeb.</li><li>Współrzędne odczytasz w Mapach Google: kliknij wybrane miejsce prawym przyciskiem, a pierwsza pozycja w menu to szerokość i długość geograficzna. Można je też pobrać z serwisu <a target='_blank' rel='noreferrer' href='https://www.latlong.net/'>latlong.net</a>.</li><li>W zakładce <strong>Ustawienia mapy</strong> ustaw przybliżenie, wysokość mapy i wygląd pinezek.</li><li>Opublikuj moduł w pozycji szablonu i przypisz go do wybranych stron.</li></ol>"
MOD_PPOSMAP_ABOUT_GOTCHAS_LABEL="Rzeczy, które warto wiedzieć"
MOD_PPOSMAP_ABOUT_GOTCHAS_DESC="<ul><li><strong>Punkt bez współrzędnych nie istnieje.</strong> Wiersz z pustą szerokością albo długością geograficzną jest pomijany w całości: nie trafi ani na mapę, ani na listę, ani do danych strukturalnych. Dzięki temu kolejność na liście zawsze zgadza się z pinezkami.</li><li><strong>Lista punktów jest widoczna tylko na komputerach.</strong> Na telefonach moduł ją ukrywa, żeby mapa miała całą szerokość ekranu.</li><li><strong>Opis punktu zachowuje się inaczej w dymku niż na liście.</strong> W dymku działa proste formatowanie HTML, na liście pokazywany jest sam tekst skrócony do dziewięciu słów.</li><li><strong>Godziny otwarcia to dwa osobne pola.</strong> W pierwszym wpisujesz napis widoczny dla odwiedzających, w drugim zapis w formacie Schema.org dla wyszukiwarek. Wypełnienie samego pierwszego jest w porządku, jeśli nie potrzebujesz danych strukturalnych.</li><li><strong>Klasy CSS przycisku zastępują styl modułu w całości.</strong> Po wpisaniu na przykład btn btn-primary przycisk przejmuje wygląd z szablonu, zamiast mieszać go z własnym stylem modułu.</li><li><strong>Punkt zaczepienia pinezki decyduje, które miejsce obrazka wskazuje współrzędne.</strong> Dla klasycznej pinezki z czubkiem wybierz Dół, dla okrągłego znacznika Środek.</li><li><strong>Po aktualizacji modułu odśwież stronę z pominięciem pamięci podręcznej</strong> (Ctrl+Shift+R). Moduł znakuje swoje pliki CSS i JS numerem wersji, ale przeglądarka mogła już zapamiętać poprzedni adres.</li></ul>"
MOD_PPOSMAP_ABOUT_TILES_LABEL="Serwer kafelków i atrybucja (tryb Leaflet)"
MOD_PPOSMAP_ABOUT_TILES_DESC="<p>Podmiana adresu serwera kafelków zmienia wygląd mapy, ale <strong>nie zmienia napisu o prawach autorskich w jej rogu</strong>. Domyślnie moduł pokazuje atrybucję OpenStreetMap, która po zmianie dostawcy przestaje być prawdziwa.</p><p>Atrybucja jest warunkiem licencji u większości dostawców kafelków, więc po wpisaniu własnego adresu uzupełnij też pole <strong>Atrybucja kafelków</strong>. Gdy go zabraknie, moduł wypisze ostrzeżenie w konsoli przeglądarki.</p><p>Gotowe adresy i pasujące do nich atrybucje znajdziesz w pliku README modułu oraz na stronie <a target='_blank' rel='noreferrer' href='https://leaflet-extras.github.io/leaflet-providers/preview/'>leaflet-providers</a>. Ustaw przy okazji maksymalne przybliżenie kafelków: powyżej wartości obsługiwanej przez dostawcę mapa pokazuje szare pola zamiast obrazu.</p>"
MOD_PPOSMAP_ABOUT_SCHEMA_LABEL="Dane strukturalne (Schema.org)"
MOD_PPOSMAP_ABOUT_SCHEMA_DESC="<p>Moduł potrafi dopisać do strony niewidoczny znacznik JSON-LD z listą lokalizacji. Wyszukiwarki czytają z niego adres, współrzędne, godziny otwarcia i telefon.</p><ul><li><strong>Opcję o własnych lokalizacjach włącz tylko dla swoich placówek.</strong> Powiązanie z organizacją prowadzącą stronę ma sens dla oddziałów i punktów odbioru. Przy mapie niezależnych firm, na przykład w katalogu, zostaw ją wyłączoną.</li><li><strong>Jeśli moduł jest przypisany do wszystkich stron, wskaż jedną podstronę</strong> w polu z wyborem pozycji menu. Powtórzenie tych samych lokalizacji na każdej stronie witryny nie pomaga w wynikach wyszukiwania.</li><li><strong>Typ punktów dobierz zgodnie ze stanem faktycznym.</strong> Miejsce i Atrakcja turystyczna opisują samą lokalizację, pozostałe typy oznaczają dodatkowo działalność gospodarczą.</li><li>Wynik sprawdzisz w <a target='_blank' rel='noreferrer' href='https://search.google.com/test/rich-results'>teście wyników z elementami rozszerzonymi</a> albo w <a target='_blank' rel='noreferrer' href='https://validator.schema.org/'>walidatorze Schema.org</a>.</li></ul>"
MOD_PPOSMAP_ABOUT_UPDATES_LABEL="Aktualizacje"
MOD_PPOSMAP_ABOUT_UPDATES_DESC="<p><strong>Tak, moduł ma własny serwer aktualizacji.</strong> Joomla sama sprawdza, czy ukazała się nowsza wersja, i pokazuje ją w panelu tak samo jak aktualizacje rozszerzeń z katalogu. Instalacja wymaga kliknięcia, bo Joomla nie aktualizuje rozszerzeń bez potwierdzenia.</p><ul><li>Przejdź do <strong>System &rarr; Aktualizuj &rarr; Rozszerzenia</strong>. Przycisk <strong>Sprawdź aktualizacje</strong> wymusza sprawdzenie od razu, z pominięciem zapamiętanej odpowiedzi.</li><li>Joomla pobiera paczkę z serwisu GitHub i porównuje jej sumę kontrolną SHA-256 z wartością podaną przez serwer aktualizacji, więc plik uszkodzony albo podmieniony po drodze nie zostanie zainstalowany.</li><li>Aktualizacja nadpisuje pliki modułu i zachowuje zarówno ustawienia, jak i dodane punkty.</li><li>Wykaz wydań i opis zmian: <a target='_blank' rel='noreferrer' href='https://github.com/pablop76/mod_pposmap/releases'>github.com/pablop76/mod_pposmap</a>.</li></ul>"
