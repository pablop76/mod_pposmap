; language strings used inside mod_pposmap 
MOD_PPOSMAP_NAME="Mapa z punktami"
MOD_PPOSMAP_DESCRIPTION="Wyświetla mapę z zaznaczonymi punktami i opcjonalną listą lokalizacji. Do wyboru Mapbox albo Leaflet z OpenStreetMap."
MOD_PPOSMAP_DESRIPTION_GROUPS="Pokaż możliwość sortowania punktów według ustawionej nazwy grupy"
MOD_PPOSMAP_TOKEN_MAPBOX="Dodaj swój <a target='_blank' rel='noreferrer' href='https://www.mapbox.com/studio/account/tokens'>token do Mapbox</a>"
MOD_PPOSMAP_STYLE_MAPBOX="Dodaj własne <a target='_blank' rel='noreferrer' href='https://docs.mapbox.com/studio-manual/guides/map-styling/#template-styles'>style Mapbox</a>"
MOD_PPOSMAP_LONGITUDE="Dodaj długość geograficzną punktu"
MOD_PPOSMAP_LATITUDE="Dodaj szerokość geograficzną punktu"
MOD_PPOSMAP_OPENINGHOURS="Dodaj godziny otwarcia"
MOD_PPOSMAP_TELEPHONE="Dodaj numer telefonu"
MOD_PPOSMAP_ZOOM="Ustaw zoom dla mapy"
MOD_PPOSMAP_GEOTITLE="Dodaj tytuł markera na mapie"
MOD_PPOSMAP_GEODESCRIPTION="Dodaj krótki opis na markerze mapy"
MOD_PPOSMAP_MARKER="Domyślna pinezka"
MOD_PPOSMAP_MARKER_DESC="Opcjonalnie. Pinezka używana dla wszystkich punktów, które nie mają ustawionej własnej. Gdy puste, moduł pokaże domyślny znacznik wybranego dostawcy mapy."
MOD_PPOSMAP_MARKER_WIDTH="Szerokość pinezki (px)"
MOD_PPOSMAP_MARKER_WIDTH_DESC="Opcjonalnie. Gdy puste, obowiązuje 50 px. Obrazek jest wpisywany w prostokąt o podanych wymiarach z zachowaniem proporcji, więc nie zostanie zniekształcony."
MOD_PPOSMAP_MARKER_HEIGHT="Wysokość pinezki (px)"
MOD_PPOSMAP_MARKER_HEIGHT_DESC="Opcjonalnie. Gdy puste, obowiązuje 64 px."
MOD_PPOSMAP_MARKER_ANCHOR="Punkt zaczepienia pinezki"
MOD_PPOSMAP_MARKER_ANCHOR_DESC="Miejsce obrazka, które ma wskazywać dokładne współrzędne punktu. Dla klasycznej pinezki z czubkiem wybierz „Dół”, dla okrągłego znacznika „Środek”."
MOD_PPOSMAP_MARKER_ANCHOR_BOTTOM="Dół (czubek pinezki)"
MOD_PPOSMAP_MARKER_ANCHOR_CENTER="Środek"
MOD_PPOSMAP_MARKER_ANCHOR_TOP="Góra"
MOD_PPOSMAP_POPUP_IMAGE="Zdjęcie w dymku punktu"
MOD_PPOSMAP_POPUP_IMAGE_DESC="Opcjonalnie. Zdjęcie pokazywane w dymku po kliknięciu pinezki."
MOD_PPOSMAP_POINT_MARKER="Własna pinezka tego punktu"
MOD_PPOSMAP_POINT_MARKER_DESC="Opcjonalnie. Zastępuje domyślną pinezkę z ustawień mapy tylko dla tego jednego punktu. Przydatne, gdy chcesz odróżnić np. siedzibę od punktów odbioru."
MOD_PPOSMAP_SUBFORM_FIELD="Dodaj kolejny <a target='_blank' rel='noreferrer' href='https://www.latlong.net/'>punkt na mapie</a>"
MOD_PPOSMAP_SUBFORM_FIELD_DESC="Każdy wiersz to jeden znacznik na mapie. Wymagane są tylko współrzędne, reszta pól jest opcjonalna."
MOD_PPOSMAP_SHOW_LIST_POINTS="Dodaj listę punktów jako opis mapy (tylko na desktop)"
MOD_PPOSMAP_SHOW_LIST_POINTS_DESC="Lista punktów jest widoczna tylko na desktop (na mobile jest ukryta)."
MOD_PPOSMAP_TILE_URL="Adres serwera kafelków"
MOD_PPOSMAP_TILE_URL_DESC="Opcjonalnie. Szablon adresu z polami {z}/{x}/{y}, np. https://tile.openstreetmap.org/{z}/{x}/{y}.png. Klucz API dopisz na końcu jako parametr, np. ?apikey=TWOJ_KLUCZ. Gdy puste, moduł użyje kafelków OpenStreetMap. Po zmianie dostawcy uzupełnij też pole „Atrybucja kafelków”, bo domyślna atrybucja OpenStreetMap przestaje być prawdziwa. Podgląd stylów i gotowe adresy: <a target='_blank' rel='noreferrer' href='https://leaflet-extras.github.io/leaflet-providers/preview/'>leaflet-providers</a>."
MOD_PPOSMAP_TILE_ATTRIBUTION="Atrybucja kafelków"
MOD_PPOSMAP_TILE_ATTRIBUTION_DESC="Opcjonalnie. Napis o prawach autorskich w rogu mapy, dozwolone odnośniki HTML. Wymagany przez większość dostawców kafelków. Gdy puste, moduł pokaże atrybucję OpenStreetMap."
MOD_PPOSMAP_TILE_MIN_ZOOM="Minimalne przybliżenie kafelków"
MOD_PPOSMAP_TILE_MIN_ZOOM_DESC="Opcjonalnie. Najmniejsze przybliżenie obsługiwane przez dostawcę kafelków. Gdy puste, obowiązuje domyślne ustawienie Leafletu."
MOD_PPOSMAP_TILE_MAX_ZOOM="Maksymalne przybliżenie kafelków"
MOD_PPOSMAP_TILE_MAX_ZOOM_DESC="Opcjonalnie. Największe przybliżenie obsługiwane przez dostawcę. Powyżej tej wartości mapa pokazuje szare pola zamiast kafelków. OpenStreetMap obsługuje 19."
MOD_PPOSMAP_CHOICEMAPBOXLEAFLET="Dostawca"
MOD_PPOSMAP_MAPBOXCHOICE="Mapbox"
MOD_PPOSMAP_LEAFLETCHOICE="Leaflet"
MOD_PPOSMAP_FIELDSET_DISPLAY="Ustawienia mapy"
MOD_PPOSMAP_LAYER_GROUPS="Kontrola grup na mapie"
MOD_PPOSMAP_LAYER_GROUP_NAME="Nazwa grupy"
MOD_PPOSMAP_GROUP_LEAFLET_ALL="Wszystkie"
MOD_PPOSMAP_MAP_HEIGHT="Wysokość mapy"
MOD_PPOSMAP_MAP_HEIGHT_DESC="Opcjonalnie. Podaj np. 500px, 70vh, 100%. Gdy puste, użyta będzie domyślna wysokość z CSS."
MOD_PPOSMAP_MAP_HEIGHT_MOBILE="Wysokość mapy (mobile)"
MOD_PPOSMAP_MAP_HEIGHT_MOBILE_DESC="Opcjonalnie. Podaj np. 400px lub 60vh. Gdy puste, użyta będzie wysokość z pola 'Wysokość mapy' lub bezpieczne minimum."
MOD_PPOSMAP_ADD_SCHEMA="Dodaj dane strukturalne (Schema.org)"
MOD_PPOSMAP_ADD_SCHEMA_DESC="Dodaje niewidoczny znacznik JSON-LD (Schema.org) z listą punktów dla wyszukiwarek. Wyłącz, jeśli masz już własne dane strukturalne dla tych lokalizacji."
MOD_PPOSMAP_STREET_ADDRESS="Ulica i numer"
MOD_PPOSMAP_STREET_ADDRESS_DESC="Do danych strukturalnych. Sam adres, bez kodu i miejscowości, np. plac Defilad 1."
MOD_PPOSMAP_POSTAL_CODE="Kod pocztowy"
MOD_PPOSMAP_ADDRESS_LOCALITY="Miejscowość"
MOD_PPOSMAP_SCHEMA_OPENING_HOURS="Godziny otwarcia w formacie Schema.org"
MOD_PPOSMAP_SCHEMA_OPENING_HOURS_DESC="Do danych strukturalnych, format maszynowy, jedna reguła w wierszu. Dni po angielsku dwuliterowo: Mo, Tu, We, Th, Fr, Sa, Su. Przykład: Mo-Fr 09:00-17:00, a w drugim wierszu Sa 10:00-14:00. Moduł rozwija to na pełną specyfikację godzin, więc działa dla każdego typu obiektu. Napis widoczny dla odwiedzających wypełnij wyżej, w polu „Dodaj godziny otwarcia”. Wiersz w innym formacie zostanie pominięty."
MOD_PPOSMAP_POINT_URL="Adres strony punktu"
MOD_PPOSMAP_POINT_URL_DESC="Do danych strukturalnych. Odnośnik do podstrony opisującej tę lokalizację, jeśli taka istnieje."
MOD_PPOSMAP_SCHEMA_TYPE="Typ punktów w danych strukturalnych"
MOD_PPOSMAP_SCHEMA_TYPE_DESC="Czym są punkty na mapie. „Miejsce” i „Atrakcja turystyczna” opisują lokalizację; pozostałe typy oznaczają dodatkowo działalność gospodarczą i tylko one mogą być powiązane z organizacją. Nie oznaczaj jako firmy punktów, które do ciebie nie należą."
MOD_PPOSMAP_SCHEMA_TYPE_PLACE="Miejsce (Place)"
MOD_PPOSMAP_SCHEMA_TYPE_TOURISTATTRACTION="Atrakcja turystyczna (TouristAttraction)"
MOD_PPOSMAP_SCHEMA_TYPE_LOCALBUSINESS="Firma lokalna (LocalBusiness)"
MOD_PPOSMAP_SCHEMA_TYPE_STORE="Sklep (Store)"
MOD_PPOSMAP_SCHEMA_TYPE_RESTAURANT="Restauracja (Restaurant)"
MOD_PPOSMAP_SCHEMA_TYPE_MEDICALBUSINESS="Placówka medyczna (MedicalBusiness)"
MOD_PPOSMAP_SCHEMA_TYPE_AUTOMOTIVEBUSINESS="Branża motoryzacyjna (AutomotiveBusiness)"
MOD_PPOSMAP_SCHEMA_TYPE_PROFESSIONALSERVICE="Usługi profesjonalne (ProfessionalService)"
MOD_PPOSMAP_SCHEMA_TYPE_LODGINGBUSINESS="Nocleg (LodgingBusiness)"
MOD_PPOSMAP_SCHEMA_MENU_ITEMS="Wypisuj dane strukturalne tylko na tych stronach"
MOD_PPOSMAP_SCHEMA_MENU_ITEMS_DESC="Opcjonalnie. Gdy puste, znacznik pojawia się wszędzie, gdzie moduł jest wyświetlany. Jeśli moduł jest przypisany do wszystkich stron, wskaż tu jedną podstronę: powielanie tych samych lokalizacji na każdej stronie witryny jest niepożądane, bo dane o firmie powinny być tam, gdzie faktycznie ją opisujesz."
MOD_PPOSMAP_SCHEMA_OWN_LOCATIONS="To są lokalizacje mojej firmy"
MOD_PPOSMAP_SCHEMA_OWN_LOCATIONS_DESC="Włącz tylko wtedy, gdy punkty na mapie to oddziały, punkty odbioru albo placówki podmiotu prowadzącego tę stronę. Moduł doda wtedy węzeł Organization i powiąże z nim każdy punkt. Przy mapie niezależnych firm, np. w katalogu, zostaw wyłączone: powiązanie cudzej firmy ze swoją organizacją byłoby nieprawdą wobec wyszukiwarki."
MOD_PPOSMAP_SAME_AS="Profile zewnętrzne punktu"
MOD_PPOSMAP_SAME_AS_DESC="Do danych strukturalnych. Adresy opisujące tę samą lokalizację gdzie indziej, np. wizytówka Google albo profil na Facebooku. Jeden adres w wierszu."
MOD_PPOSMAP_ADDRESS_COUNTRY="Kraj"
MOD_PPOSMAP_ADDRESS_COUNTRY_DESC="Do danych strukturalnych, wspólny dla wszystkich punktów. Dwuliterowy kod ISO, np. PL. Gdy puste, kraj nie trafia do danych."
MOD_PPOSMAP_VIEW_BUTTON="ZOBACZ"
MOD_PPOSMAP_LIST_WIDTH="Szerokość listy punktów"
MOD_PPOSMAP_LIST_WIDTH_DESC="Opcjonalnie. Podaj np. 300px, 25rem albo 25%. Gdy puste, obowiązuje 300 px. Za wąska kolumna łamie adres i przycisk na kilka linii."
MOD_PPOSMAP_VIEW_BUTTON_TEXT="Napis na przycisku"
MOD_PPOSMAP_VIEW_BUTTON_TEXT_DESC="Opcjonalnie. Gdy puste, moduł użyje napisu z tłumaczenia (domyślnie „ZOBACZ”)."
MOD_PPOSMAP_VIEW_BUTTON_CLASS="Klasy CSS przycisku"
MOD_PPOSMAP_VIEW_BUTTON_CLASS_DESC="Opcjonalnie. Gdy puste, przycisk dostaje własny, neutralny styl modułu. Wpisanie klas zastępuje go w całości, żeby style się nie mieszały: dla szablonu na Bootstrapie użyj np. btn btn-primary."
MOD_PPOSMAP_CLUSTER_MARKERS="Grupuj bliskie markery (klastrowanie)"
MOD_PPOSMAP_CLUSTER_MARKERS_DESC="Przy wielu punktach blisko siebie łączy je w jeden znacznik z liczbą — po kliknięciu mapa się przybliża. Zalecane przy więcej niż kilkunastu punktach."
MOD_PPOSMAP_FIELDSET_ABOUT="O module"
MOD_PPOSMAP_CREDIT_LABEL="mod_pposmap v1.1.4"
MOD_PPOSMAP_CREDIT_DESC="Autor: pablop76 — <a href='https://web-service.com.pl/' target='_blank' rel='noreferrer'>web-service.com.pl</a>"
